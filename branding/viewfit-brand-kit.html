<title>ViewFit Brand Kit</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--panel:#121218;--line:rgba(255,255,255,.09);--text:#f4f4f5;--muted:#a1a1aa;--indigo:#6366f1;--purple:#a855f7}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Pretendard","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;padding-inline:16px;padding-block:40px 56px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--purple);font-weight:700;margin:0}
h1{margin:4px 0 0;font-size:clamp(24px,4vw,32px);font-weight:800;text-wrap:balance}
h1 span{background:linear-gradient(90deg,var(--indigo),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h2{margin:0;font-size:18px}
.spec{margin:2px 0 0;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:14px;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:linear-gradient(90deg,var(--indigo),var(--purple))}
button:focus-visible{outline:2px solid #fde047;outline-offset:2px}
.frame{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.frame svg{display:block;width:100%;height:auto}
.icons{display:flex;flex-wrap:wrap;align-items:flex-end;gap:28px}
.icons .hero svg{width:min(260px,100%);height:auto;display:block}
.sizes{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
.sizes figcaption{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.status{font-size:13px;color:#fde047;min-height:1.2em;margin:0}
</style>
<div class="wrap">
<header><p class="eyebrow">Notion Brand Kit</p><h1>View<span>Fit</span> 아이콘 &amp; 커버</h1></header>
